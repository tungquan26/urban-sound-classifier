<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Sound Classifier - AI Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { paper: '#fdfbf7', ink: '#2d2d2d', muted: '#e5e0d8', primary: '#ff4d4d', secondary: '#2d5da1' },
          fontFamily: { kalam: ['Kalam', 'cursive'], patrick: ['Patrick Hand', 'cursive'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center selection:bg-primary selection:text-white">

  <header class="w-full max-w-[1400px] mb-8 lg:mb-12 flex flex-col md:flex-row md:items-end justify-between gap-4 px-2">
    <div>
      <h1 class="text-4xl md:text-5xl font-kalam font-bold text-ink inline-block relative">
        Urban Sound Classifier
        <svg class="absolute -bottom-3 left-0 w-full h-4" preserveAspectRatio="none" viewBox="0 0 100 10">
          <path d="M0,5 Q50,10 100,2" stroke="#2d5da1" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M5,8 Q45,2 95,8" stroke="#ff4d4d" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
      </h1>
    </div>
  </header>

  <main class="w-full max-w-[1400px] flex flex-col gap-10 lg:gap-12 pb-16 relative">

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-10">

      <section class="card-sketch wobbly-1 bg-white border-4 border-ink p-6 md:p-8 relative flex flex-col min-h-[340px]">
        <div class="tape-strip top-[-14px] right-8 rotate-[4deg]"></div>
        <div class="flex items-center gap-3 mb-6 border-b-4 border-ink pb-3 border-dashed">
          <div class="w-8 h-8 rounded-full bg-secondary text-white font-kalam font-bold flex items-center justify-center text-xl wobbly-circle border-2 border-ink">1</div>
          <h2 class="text-3xl font-kalam font-bold text-ink">Audio Input</h2>
        </div>

        <div id="drop-zone" class="w-full flex-grow border-4 border-dashed border-ink bg-paper wobbly-3 flex flex-col items-center justify-center p-6 cursor-pointer hover:bg-muted transition-colors relative overflow-hidden">
          <input type="file" id="file-input" class="hidden" accept=".wav,.mp3" />
          <p class="font-kalam text-2xl text-center font-bold mb-2 text-ink">Drag & Drop Audio File</p>
          <p class="text-base text-ink mb-8 font-bold opacity-70">WAV, MP3 supported</p>
          <button id="btn-browse" class="btn-sketch px-8 py-3 font-kalam text-xl font-bold wobbly-btn flex items-center gap-2">CLICK TO BROWSE</button>
        </div>
      </section>

      <section class="card-sketch wobbly-2 bg-white border-4 border-ink p-6 md:p-8 relative flex flex-col min-h-[340px]">
        <div class="tape-strip top-[-10px] left-1/2 -translate-x-1/2 rotate-[1deg]"></div>
        <div class="flex items-center gap-3 mb-6 border-b-4 border-ink pb-3">

          <div class="w-8 h-8 rounded-full bg-secondary text-white font-kalam font-bold flex items-center justify-center text-xl wobbly-circle border-2 border-ink">2</div>
          <h2 class="text-3xl font-kalam font-bold text-ink">Uploaded File</h2>
        </div>

        <div class="bg-muted border-4 border-ink p-5 wobbly-4 mb-8 shadow-inner relative flex-grow">
          <div class="flex items-center justify-between mb-4 border-b-2 border-ink/40 border-dashed pb-4">
            <span class="font-bold flex items-center gap-3 text-lg text-ink truncate pr-4">
              <span id="file-name" class="truncate">No file selected</span>
            </span>
          </div>
          <div class="grid grid-cols-2 gap-y-4 gap-x-2 text-base font-bold text-ink">
            <div>Type: <span id="file-type" class="text-secondary font-kalam text-lg">---</span></div>
            <div>Size: <span id="file-size" class="text-secondary font-kalam text-lg">---</span></div>
            <div>Duration: <span id="file-duration" class="text-secondary font-kalam text-lg">---</span></div>
            <div>Sample: <span id="file-sample" class="text-secondary font-kalam text-lg">---</span></div>
          </div>
        </div>

        <div class="mt-auto flex justify-center w-full">
          <button type="button" id="btn-classify"
            class="btn-primary w-full py-5 text-2xl font-kalam font-bold flex items-center justify-center gap-3 group">
            CLASSIFY AUDIO
          </button>
        </div>
      </section>

    </div>

    <div id="analysis-results" class="flex flex-col gap-8 lg:gap-10 scroll-mt-6">

      <section class="card-sketch wobbly-3 bg-white border-4 border-ink p-6 md:p-8 relative flex flex-col">
        <div class="tape-strip top-[-10px] left-20 rotate-[-2deg]"></div>
        <div class="flex items-center gap-3 mb-6 border-b-4 border-ink pb-3 w-4/5 md:w-2/5">

          <div class="w-8 h-8 rounded-full bg-secondary text-white font-kalam font-bold flex items-center justify-center text-xl wobbly-circle border-2 border-ink">3</div>
          <h2 class="text-3xl font-kalam font-bold text-ink">Current Analytics</h2>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-[1fr_2fr] gap-8 items-start">

          <div class="flex flex-col gap-6">
            <div>
              <p class="text-base font-bold text-ink uppercase tracking-widest mb-3">Classification Match</p>
              <h3 id="result-label" class="text-5xl lg:text-6xl font-kalam font-bold text-primary bg-paper px-5 py-4 border-4 border-ink inline-block wobbly-4 shadow-[5px_5px_0_0_#2d2d2d] rotate-[-2deg]">WAITING...</h3>
            </div>

            <div class="bg-secondary text-white px-6 py-4 border-4 border-ink wobbly-1 shadow-[4px_4px_0_0_#2d2d2d] rotate-2 w-fit">
              <p class="text-sm uppercase tracking-wider font-bold opacity-90 mb-1">Confidence</p>
              <p id="result-confidence" class="text-5xl font-kalam font-bold leading-none">0%</p>
            </div>
          </div>

          <div class="flex flex-col h-full min-h-[300px]">
            <h4 class="font-kalam text-2xl font-bold mb-4 text-ink">Probability Distribution</h4>
            <div class="flex-grow w-full relative">
              <canvas id="probabilityChart"></canvas>
            </div>
          </div>
        </div>
      </section>

      <section class="card-sketch wobbly-4 bg-white border-4 border-ink p-6 md:p-8 relative flex flex-col">
        <div class="tape-strip top-[-10px] right-16 rotate-[-5deg]"></div>
        <div class="flex items-center gap-3 mb-6 border-b-4 border-ink pb-3 w-4/5 md:w-2/5">

          <div class="w-8 h-8 rounded-full bg-secondary text-white font-kalam font-bold flex items-center justify-center text-xl wobbly-circle border-2 border-ink">4</div>
          <h2 class="text-3xl font-kalam font-bold text-ink">Audio Waveform</h2>
        </div>

        <div class="w-full h-40 md:h-56 border-4 border-ink wobbly-3 mb-6 bg-white relative overflow-hidden flex items-center justify-center shadow-[4px_4px_0_0_#2d2d2d]">
          <div id="waveform" class="w-full h-full absolute inset-0"></div>
        </div>

        <div class="flex flex-col sm:flex-row items-center justify-between gap-6 bg-muted/30 p-4 border-2 border-ink border-dashed wobbly-1">
          <div class="flex items-center gap-4 shrink-0">
            <button id="btn-play-pause" class="w-14 h-14 bg-white border-4 border-ink flex items-center justify-center wobbly-circle hover:bg-primary hover:text-white transition-colors text-ink shadow-[4px_4px_0_0_#2d2d2d]">
              <svg id="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" class="ml-1"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              <svg id="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" class="hidden"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </button>
          </div>

          <div class="font-kalam font-bold text-2xl tracking-wide shrink-0 bg-white border-2 border-ink px-3 py-1 wobbly-4 rotate-2 ml-auto">
            <span id="time-current" class="text-primary">00:00</span> <span class="text-ink">/</span> <span id="time-total" class="text-ink">00:00</span>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
